name: AutoPilot

# Runs the AutoPilot engine every 15 minutes. Needs the repo secret CRON_SECRET
# (same value as the CRON_SECRET env var on Vercel).
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger AutoPilot
        run: |
          curl -fsS --max-time 290 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://flow.flatpurse.com/api/cron/autopilot
